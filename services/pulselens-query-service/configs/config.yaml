service:
  name: pulselens-query-service
server:
  port: "127.0.0.1:8084"
postgres:
  dsn: "host=localhost user=pulselens password=pulselens dbname=pulselens port=5433 sslmode=disable"
clickhouse:
  enabled: true
  baseUrl: "http://localhost:8123"
  database: "pulselens"
  username: "pulselens"
  password: "pulselens"
redis:
  hosts:
    - "localhost:6381"
  db: 0
kafka:
  brokers:
    - "localhost:9093"
  groups:
    processing: "pulselens-processing-v1"
  topics:
    logs: "pulselens.logs.v1"
    metrics: "pulselens.metrics.v1"
    traces: "pulselens.traces.v1"
    custom: "pulselens.custom.v1"
    retry: "pulselens.retry.v1"
    retryScheduled: "pulselens.retry.scheduled.v1"
jwt:
  secret: "pulselens-local-secret"
ui:
  dir: "../pulselens-ui/dist"
runtime:
  heartbeatIntervalSeconds: 5
  heartbeatTTLSeconds: 15
backpressure:
  logsMaxPending: 2000
  metricsMaxPending: 2000
  tracesMaxPending: 2000
  customMaxPending: 1000
cache:
  ttlSeconds: 5
archive:
  enabled: true
  endpoint: "http://localhost:9010"
  region: "us-east-1"
  accessKey: "minioadmin"
  secretKey: "minioadmin"
  bucket: "pulselens-archive"
  prefix: "raw"
  forcePathStyle: true
