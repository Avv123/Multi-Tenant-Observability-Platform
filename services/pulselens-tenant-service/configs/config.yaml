service:
  name: pulselens-tenant-service
server:
  port: "127.0.0.1:8081"
log:
  level: debug
  format: json
  request: true
  response: false
postgres:
  dsn: "host=localhost user=omniful password=omniful dbname=pulselens port=5433 sslmode=disable"
redis:
  clusterMode: false
  hosts:
    - "localhost:6381"
  db: 0
jwt:
  secret: "pulselens-local-secret"
  expiryMinutes: 720
internal:
  token: "pulselens-internal-token"
runtime:
  heartbeatIntervalSeconds: 5
  heartbeatTTLSeconds: 15
