service:
  name: pulselens-processing-service
server:
  port: "127.0.0.1:8083"
postgres:
  dsn: "host=localhost user=omniful password=omniful dbname=pulselens port=5433 sslmode=disable"
clickhouse:
  enabled: true
  baseUrl: "http://localhost:8123"
  database: "pulselens"
  username: "omniful"
  password: "omniful"
redis:
  hosts:
    - "localhost:6381"
  db: 0
kafka:
  brokers:
    - "localhost:9093"
  groupId: "pulselens-processing-v1"
  topics:
    logs: "pulselens.logs.v1"
    metrics: "pulselens.metrics.v1"
    traces: "pulselens.traces.v1"
    custom: "pulselens.custom.v1"
    retry: "pulselens.retry.v1"
    retryScheduled: "pulselens.retry.scheduled.v1"
retry:
  maxCount: 3
  baseDelaySeconds: 15
retention:
  telemetryDays: 7
  archiveDays: 14
  cleanupIntervalSeconds: 20
archive:
  enabled: false
  endpoint: "http://localhost:9010"
  region: "us-east-1"
  accessKey: "minioadmin"
  secretKey: "minioadmin"
  bucket: "pulselens-archive"
  prefix: "raw"
  forcePathStyle: true
replay:
  pollSeconds: 3
runtime:
  heartbeatIntervalSeconds: 5
  heartbeatTTLSeconds: 15
backpressure:
  logsMaxPending: 2000
  metricsMaxPending: 2000
  tracesMaxPending: 2000
  customMaxPending: 1000
