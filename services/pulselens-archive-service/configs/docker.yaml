service:
  name: pulselens-archive-service
server:
  port: ":8086"
postgres:
  dsn: "host=postgres user=omniful password=omniful dbname=pulselens port=5432 sslmode=disable"
redis:
  hosts:
    - "redis:6379"
  db: 0
kafka:
  brokers:
    - "kafka:9092"
  topics:
    logs: "pulselens.logs.v1"
    metrics: "pulselens.metrics.v1"
    traces: "pulselens.traces.v1"
    custom: "pulselens.custom.v1"
jwt:
  secret: "pulselens-local-secret"
archive:
  enabled: true
  endpoint: "http://minio:9000"
  region: "us-east-1"
  accessKey: "minioadmin"
  secretKey: "minioadmin"
  bucket: "pulselens-archive"
  prefix: "raw"
  forcePathStyle: true
replay:
  pollSeconds: 3
  lockTTLSeconds: 20
runtime:
  heartbeatIntervalSeconds: 5
  heartbeatTTLSeconds: 15

