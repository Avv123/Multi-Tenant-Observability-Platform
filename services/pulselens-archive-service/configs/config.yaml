service:
  name: pulselens-archive-service
server:
  port: "127.0.0.1:8086"
postgres:
  dsn: "host=localhost user=omniful password=omniful dbname=pulselens port=5433 sslmode=disable"
redis:
  hosts:
    - "localhost:6381"
  db: 0
kafka:
  brokers:
    - "localhost:9093"
  topics:
    logs: "pulselens.logs.v1"
    metrics: "pulselens.metrics.v1"
    traces: "pulselens.traces.v1"
    custom: "pulselens.custom.v1"
jwt:
  secret: "pulselens-local-secret"
archive:
  enabled: true
  endpoint: "http://localhost:9010"
  region: "us-east-1"
  accessKey: "minioadmin"
  secretKey: "minioadmin"
  bucket: "pulselens-archive"
  prefix: "raw"
  forcePathStyle: true
replay:
  pollSeconds: 3
  lockTTLSeconds: 20
runtime:
  heartbeatIntervalSeconds: 5
  heartbeatTTLSeconds: 15
