# I1: All services now have mem_limit + cpus constraints so no single container
#     can starve the host or other services under local load.
# I2: Named volumes for Postgres, ClickHouse, Redis, and MinIO so data survives
#     docker compose down. Backup/restore drills now have persistent data to work with.
# I3: Kafka topics are created with explicit partition counts matching the shard
#     bucket configuration (8 shards → 8 partitions per signal topic).
# I4: Credentials read from environment variables; copy .env.example → .env.

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulselens-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omniful}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omniful}
      POSTGRES_DB: ${POSTGRES_DB:-pulselens}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    cpus: 1.0
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omniful} -d ${POSTGRES_DB:-pulselens}" ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: pulselens-redis
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    cpus: 0.5
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: redpandadata/redpanda:v24.2.10
    container_name: pulselens-kafka
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "512M"
      - --reserve-memory
      - "0M"
      - --unsafe-bypass-fsync=true
      - --check=false
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://kafka:9092,OUTSIDE://localhost:9093
    ports:
      - "9093:19092"
    volumes:
      - kafka_data:/var/lib/redpanda/data
    mem_limit: ${KAFKA_MEM_LIMIT:-768m}
    cpus: 1.0
    healthcheck:
      test: [ "CMD-SHELL", "rpk cluster health | grep -q Healthy" ]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka-init:
    image: redpandadata/redpanda:v24.2.10
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -lc
      - |
        # I3: 8 partitions per signal topic matches the rendezvous-hash shard bucket
        # count so each shard maps cleanly to a partition with no cross-partition
        # fan-out overhead. Retry and scheduled-retry topics use 1 partition since
        # they are low-volume and order matters for retry sequencing.
        rpk topic create pulselens.logs.v1       --brokers kafka:9092 --partitions 8 --replicas 1 || true
        rpk topic create pulselens.metrics.v1    --brokers kafka:9092 --partitions 8 --replicas 1 || true
        rpk topic create pulselens.traces.v1     --brokers kafka:9092 --partitions 8 --replicas 1 || true
        rpk topic create pulselens.custom.v1     --brokers kafka:9092 --partitions 8 --replicas 1 || true
        rpk topic create pulselens.retry.v1              --brokers kafka:9092 --partitions 1 --replicas 1 || true
        rpk topic create pulselens.retry.scheduled.v1    --brokers kafka:9092 --partitions 1 --replicas 1 || true

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: pulselens-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-pulselens}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-omniful}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-omniful}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    mem_limit: ${CLICKHOUSE_MEM_LIMIT:-2g}
    cpus: 2.0
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok." ]
      interval: 5s
      timeout: 5s
      retries: 30

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: pulselens-mailhog
    ports:
      - "1026:1025"
      - "8026:8025"
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8025/api/v2/messages >/dev/null" ]
      interval: 5s
      timeout: 5s
      retries: 20

  tenant-service:
    build:
      context: .
      dockerfile: services/pulselens-tenant-service/Dockerfile
    container_name: pulselens-tenant-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    mem_limit: ${SERVICE_MEM_LIMIT:-256m}
    cpus: 0.5
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8081/ready >/dev/null" ]
      interval: 5s
      timeout: 5s
      retries: 20

  ingest-service:
    build:
      context: .
      dockerfile: services/pulselens-ingest-service/Dockerfile
    container_name: pulselens-ingest-service
    depends_on:
      tenant-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8082:8082"
    mem_limit: ${SERVICE_MEM_LIMIT:-256m}
    cpus: 0.5
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8082/ready >/dev/null" ]
      interval: 5s
      timeout: 5s
      retries: 20

  processing-service:
    build:
      context: .
      dockerfile: services/pulselens-processing-service/Dockerfile
    container_name: pulselens-processing-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    ports:
      - "8083:8083"
    mem_limit: ${SERVICE_MEM_LIMIT:-256m}
    cpus: 1.0
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8083/ready >/dev/null" ]
      interval: 5s
      timeout: 5s
      retries: 20

  query-service:
    build:
      context: .
      dockerfile: services/pulselens-query-service/Dockerfile
    container_name: pulselens-query-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    ports:
      - "8084:8084"
    mem_limit: ${SERVICE_MEM_LIMIT:-256m}
    cpus: 0.5
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8084/ready >/dev/null" ]
      interval: 5s
      timeout: 5s
      retries: 20

  alerting-service:
    build:
      context: .
      dockerfile: services/pulselens-alerting-service/Dockerfile
    container_name: pulselens-alerting-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "8085:8085"
    mem_limit: ${SERVICE_MEM_LIMIT:-256m}
    cpus: 0.5
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8085/ready >/dev/null" ]
      interval: 5s
      timeout: 5s
      retries: 20

  ui:
    build:
      context: .
      dockerfile: services/pulselens-ui/Dockerfile
    container_name: pulselens-ui
    depends_on:
      query-service:
        condition: service_healthy
      tenant-service:
        condition: service_healthy
      ingest-service:
        condition: service_healthy
      alerting-service:
        condition: service_healthy
    ports:
      - "3000:3000"
    mem_limit: ${UI_MEM_LIMIT:-128m}
    cpus: 0.25
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null" ]
      interval: 5s
      timeout: 5s
      retries: 20

  # ClickHouse Web UI — full table/schema browser + SQL editor
  # Access at http://localhost:5521
  ch-ui:
    image: ghcr.io/caioricciuti/ch-ui:latest
    container_name: pulselens-ch-ui
    restart: unless-stopped
    ports:
      - "5521:3488"
    environment:
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-omniful}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-omniful}"
      VITE_CLICKHOUSE_URL: "http://clickhouse:8123"
      VITE_CLICKHOUSE_USER: "${CLICKHOUSE_USER:-omniful}"
      VITE_CLICKHOUSE_PASS: "${CLICKHOUSE_PASSWORD:-omniful}"
    depends_on:
      clickhouse:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.25

# I2: Named volumes keep data persistent across docker compose down/up.
# This is essential for backup/restore drills since data must survive a
# restart for there to be anything meaningful to back up and restore.
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
  clickhouse_data:
    driver: local
