services:
  postgres:
    image: postgres:16-alpine
    container_name: pulselens-postgres
    environment:
      POSTGRES_USER: omniful
      POSTGRES_PASSWORD: omniful
      POSTGRES_DB: pulselens
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniful -d pulselens"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: pulselens-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: redpandadata/redpanda:v24.2.10
    container_name: pulselens-kafka
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --check=false
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://kafka:9092,OUTSIDE://localhost:19092
    ports:
      - "9092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q Healthy"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka-init:
    image: redpandadata/redpanda:v24.2.10
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -lc
      - |
        for topic in pulselens.logs.v1 pulselens.metrics.v1 pulselens.traces.v1 pulselens.custom.v1 pulselens.retry.v1 pulselens.retry.scheduled.v1; do
          rpk topic create "$$topic" --brokers kafka:9092 || true
        done

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: pulselens-clickhouse
    environment:
      CLICKHOUSE_DB: pulselens
      CLICKHOUSE_USER: omniful
      CLICKHOUSE_PASSWORD: omniful
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok."]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: pulselens-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9010:9000"
      - "9011:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: pulselens-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8025/api/v2/messages >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  tenant-service:
    build:
      context: .
      dockerfile: services/pulselens-tenant-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"

  ingest-service:
    build:
      context: .
      dockerfile: services/pulselens-ingest-service/Dockerfile
    depends_on:
      tenant-service:
        condition: service_started
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8082:8082"

  processing-service:
    build:
      context: .
      dockerfile: services/pulselens-processing-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8083:8083"

  query-service:
    build:
      context: .
      dockerfile: services/pulselens-query-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    ports:
      - "8084:8084"

  alerting-service:
    build:
      context: .
      dockerfile: services/pulselens-alerting-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    ports:
      - "8085:8085"

  archive-service:
    build:
      context: .
      dockerfile: services/pulselens-archive-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    ports:
      - "8086:8086"
